name: Build and Release

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  build-windows:
    needs: gitleaks
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check for Version.h change
        id: version_check
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $hasParent = git rev-parse --verify HEAD^ 2>$null
          if ($hasParent) {
            $changed = git diff --name-only HEAD^ HEAD | Select-String "src/common/Version\.h"
          } else {
            $changed = git diff-tree --no-commit-id --name-only -r HEAD | Select-String "src/common/Version\.h"
          }
          if ($changed) {
            $content = Get-Content src/common/Version.h -Raw
            if ($content -match 'SPACECAL_VERSION_STRING\s+"([^"]+)"') {
              $version = $matches[1]
              Write-Output "version=$version" >> $env:GITHUB_OUTPUT
              Write-Output "changed=true" >> $env:GITHUB_OUTPUT
              Write-Host "Version.h changed to $version"
            }
          } else {
            Write-Output "changed=false" >> $env:GITHUB_OUTPUT
            Write-Host "Version.h not changed"
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -G "Ninja Multi-Config" -B bin -S . "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build Release
        run: cmake --build bin --config Release

      - name: Build Tests
        run: cmake --build bin --config Release --target SpaceCalibratorTests

      - name: Run Unit Tests
        run: ctest --test-dir bin -C Release --output-on-failure

      - name: Smoke Test Overlay
        shell: pwsh
        run: |
          # No SteamVR is installed on the runner: -openvrpath must reach
          # VR_Init, fail cleanly and exit -2. Any other outcome (crash,
          # missing DLL import, exit 0) fails the check.
          $p = Start-Process -FilePath "bin/artifacts/Release/SpaceCalibrator.exe" `
            -ArgumentList "-openvrpath" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput smoke_out.txt -RedirectStandardError smoke_err.txt
          Get-Content smoke_out.txt, smoke_err.txt
          if ($p.ExitCode -ne -2) { Write-Error "Expected exit -2, got $($p.ExitCode)" }

      - name: Smoke Test Driver
        shell: pwsh
        run: |
          # Verify the driver DLL's imports resolve (LoadLibrary runs DllMain).
          $env:PATH = "$PWD\bin\artifacts\Release;$env:PATH"
          Add-Type -Namespace Win32 -Name Native -MemberDefinition `
            '[DllImport("kernel32.dll", SetLastError=true)] public static extern System.IntPtr LoadLibraryW([System.Runtime.InteropServices.MarshalAs(System.Runtime.InteropServices.UnmanagedType.LPWStr)] string lpFileName);
             [DllImport("kernel32.dll")] public static extern bool FreeLibrary(System.IntPtr h);'
          $h = [Win32.Native]::LoadLibraryW("$PWD\bin\driver_01spacecalibrator\bin\win64\driver_01spacecalibrator.dll")
          if ($h -eq [IntPtr]::Zero) {
            $err = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
            Write-Error "LoadLibrary failed, error $err"
          }
          [Win32.Native]::FreeLibrary($h) | Out-Null
          Write-Host "Driver DLL loaded and unloaded cleanly"

      - name: Upload Overlay Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpaceCalibrator-Overlay
          path: |
            bin/artifacts/Release/SpaceCalibrator.exe
            bin/artifacts/Release/openvr_api.dll
            bin/artifacts/Release/manifest.vrmanifest
            bin/artifacts/Release/icon.png
            bin/artifacts/Release/taskbar_icon.png

      - name: Upload Driver Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpaceCalibrator-Driver
          path: |
            bin/driver_01spacecalibrator/driver.vrdrivermanifest
            bin/driver_01spacecalibrator/resources/driver.vrresources
            bin/driver_01spacecalibrator/resources/settings/default.vrsettings
            bin/driver_01spacecalibrator/bin/win64/driver_01spacecalibrator.dll

      - name: Package Release Artifacts
        if: steps.version_check.outputs.changed == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/overlay
          Copy-Item bin/artifacts/Release/SpaceCalibrator.exe release/overlay/
          Copy-Item bin/artifacts/Release/openvr_api.dll release/overlay/
          Copy-Item bin/artifacts/Release/manifest.vrmanifest release/overlay/
          Copy-Item bin/artifacts/Release/icon.png release/overlay/
          Copy-Item bin/artifacts/Release/taskbar_icon.png release/overlay/
          Compress-Archive -Path release/overlay/* -DestinationPath SpaceCalibrator-Overlay.zip
          # Keep the driver folder itself in the zip so it can be dropped into SteamVR's drivers directory as documented
          Compress-Archive -Path bin/driver_01spacecalibrator -DestinationPath SpaceCalibrator-Driver.zip

      - name: Create Tag and Release
        if: steps.version_check.outputs.changed == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version_check.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $existing = git tag -l $tag
          if ($existing) {
            Write-Host "Tag $tag already exists. Skipping."
            exit 0
          }

          git tag $tag
          git push origin $tag

          gh release create $tag `
            --title "Space Calibrator $version" `
            --generate-notes `
            SpaceCalibrator-Overlay.zip `
            SpaceCalibrator-Driver.zip
